<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CHAOS LAB — Sandbox</title>
<style>
:root{--bg:#0b0f16;--panel:#111925;--panel2:#1b2635;--line:#2a3a4f;--text:#e9f1ff;--muted:#91a2b9;--cyan:#6ce3ff;--orange:#ff985b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}
.top{position:absolute;z-index:3;top:8px;left:8px;right:8px;display:flex;align-items:center;gap:7px;pointer-events:none}.brand,.toolbar,.readout{background:#0c121dee;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px #0006;pointer-events:auto}.brand{display:flex;align-items:center;gap:9px;padding:8px 12px;font-size:13px;font-weight:1000;letter-spacing:.13em;white-space:nowrap}.logo{background:linear-gradient(135deg,#6ce3ff,#8a7cff);color:#08121d;border-radius:7px;width:29px;height:29px;display:grid;place-items:center;font-size:17px}.toolbar{display:flex;gap:5px;padding:5px;flex-wrap:wrap}.btn{border:1px solid #34465d;background:#1b2737;color:var(--text);border-radius:7px;padding:8px 10px;font-weight:750;font-size:12px;cursor:pointer}.btn:active,.btn.on{border-color:var(--cyan);background:#1e3c4c}.readout{margin-left:auto;padding:10px 12px;font-size:11px;color:var(--muted);white-space:nowrap}.readout b{color:var(--cyan)}
.panel{position:absolute;z-index:2;top:64px;left:8px;bottom:8px;width:224px;background:#0c121eef;border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 28px #0006}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-bottom:1px solid var(--line)}.tab{border:0;border-radius:6px;background:transparent;color:var(--muted);padding:9px 2px;font-size:10px;font-weight:900}.tab.on{background:#233649;color:var(--cyan)}.heading{padding:11px 10px 7px;font-size:10px;font-weight:900;letter-spacing:.14em;color:#8398b3}.items{padding:0 7px 8px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;overflow:auto}.item{border:1px solid #2a394d;background:#151e2b;color:var(--text);border-radius:8px;min-height:65px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:11px;font-weight:750}.item .emoji{font-size:22px}.item.on,.item:active{border-color:var(--cyan);background:#1d3646}.settings{padding:9px 10px;border-top:1px solid var(--line);display:grid;gap:8px;font-size:11px;color:var(--muted)}.settings label{display:flex;align-items:center;justify-content:space-between;gap:6px}.settings input{accent-color:#6ce3ff}.footer{padding:8px 10px;border-top:1px solid var(--line);font-size:10px;line-height:1.5;color:#8798af}.toast{position:absolute;z-index:5;top:75px;left:50%;transform:translateX(-50%);padding:9px 14px;border:1px solid var(--line);border-radius:9px;background:#0b121def;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}.righttools{position:absolute;z-index:2;right:9px;top:78px;display:grid;gap:6px}.righttools button{width:42px;height:42px;background:#101824eF;border:1px solid var(--line);color:var(--text);border-radius:9px;font-size:19px}.hint{position:absolute;bottom:12px;right:12px;background:#0c121de8;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--muted);font-size:10px}
@media(max-width:680px){.panel{width:142px;top:105px;left:5px;bottom:5px}.brand{padding:6px;font-size:10px}.logo{width:24px;height:24px}.toolbar{gap:3px;padding:4px}.btn{padding:7px 6px;font-size:10px}.readout{display:none}.top{left:5px;right:5px;top:5px}.item{min-height:57px;font-size:10px}.item .emoji{font-size:19px}.heading{padding:8px}.settings{font-size:10px;padding:7px}.righttools{right:5px;top:111px}.righttools button{width:35px;height:35px}.hint{right:5px;bottom:5px;font-size:9px}}
</style></head><body>
<canvas id="world"></canvas>
<div class="top"><div class="brand"><div class="logo">C</div><div>CHAOS LAB<br><span style="font-size:8px;color:#8396b1;letter-spacing:.2em">PHYSICS SANDBOX</span></div></div>
<div class="toolbar"><button class="btn" id="pause">Ⅱ Pause</button><button class="btn" id="step">▷ Step</button><button class="btn" id="save">▣ Save</button><button class="btn" id="load">↶ Load</button><button class="btn" id="clear">✕ Clear</button></div>
<div class="readout">OBJECTS <b id="count">0</b> · <span id="state">LIVE</span></div></div>
<aside class="panel"><div class="tabs"><button class="tab on" data-cat="people">PEOPLE</button><button class="tab" data-cat="props">PROPS</button><button class="tab" data-cat="weapons">WEAPONS</button><button class="tab" data-cat="tools">TOOLS</button></div><div class="heading" id="heading">SPAWN CHARACTERS</div><div class="items" id="items"></div>
<div class="settings"><label>Gravity <input id="gravity" type="checkbox" checked></label><label>Collisions <input id="collisions" type="checkbox" checked></label><label>Fire spread <input id="spread" type="checkbox" checked></label><label>Grid <input id="grid" type="checkbox" checked></label></div>
<div class="footer"><b style="color:#e9f1ff">QUICK CONTROLS</b><br>Choose an item, then tap arena to spawn.<br>Drag objects to move. Grab tool lets you throw.<br>Connect tool: tap two objects to wire them.</div></aside>
<div class="righttools"><button title="Grab" data-tool="grab">✋</button><button title="Wire" data-tool="wire">⛓</button><button title="Fire" data-tool="fire">♨</button><button title="Electricity" data-tool="electric">ϟ</button><button title="Delete" data-tool="delete">⌫</button></div><div class="hint">drag · spawn · experiment</div><div class="toast" id="toast"></div>
<script>
(()=>{
const canvas=document.getElementById('world'),c=canvas.getContext('2d');let W,H,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;c.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const catalog={people:[['ragdoll','🧍','Ragdoll'],['heavy','🦾','Heavy'],['robot','🤖','Robot'],['skeleton','💀','Skeleton'],['dummy','🧑','Test dummy']],props:[['crate','📦','Crate'],['barrel','🛢️','Barrel'],['ball','🔵','Bouncy ball'],['metal','🧱','Metal block'],['plank','🪵','Plank'],['car','🚙','Car'],['spring','🌀','Spring pad'],['lamp','💡','Lamp']],weapons:[['pistol','🔫','Blaster'],['laser','🔴','Laser'],['bomb','💣','Bomb'],['rocket','🚀','Rocket']],tools:[['grab','✋','Grab / throw'],['wire','⛓','Connect wire'],['fire','♨','Ignite'],['electric','ϟ','Electricity'],['delete','⌫','Delete'],['heal','✚','Repair'] ]};
let cat='people',selected='ragdoll',paused=false,objs=[],particles=[],wires=[],idseq=1,drag=null,wireStart=null,mouse={x:0,y:0},last=0,gravity=true,collisions=true,spread=true,showGrid=true;
const side=()=>innerWidth<=680?151:233, floor=()=>H-30;
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.opacity=0,1400)}
function count(){document.getElementById('count').textContent=objs.length}
function add(type,x,y){if(['grab','wire','fire','electric','delete','heal'].includes(type))return action(type,x,y);let dims={ragdoll:[14,39],heavy:[19,45],robot:[16,35],skeleton:[13,38],dummy:[14,38],crate:[25,25],barrel:[18,26],ball:[15,15],metal:[28,24],plank:[44,9],car:[42,18],spring:[26,10],lamp:[12,24],pistol:[19,7],laser:[24,6],bomb:[13,13],rocket:[22,8]};let [w,h]=dims[type]||[20,20];let o={id:idseq++,type,x,y,w,h,vx:(Math.random()-.5)*2,vy:0,a:0,av:(Math.random()-.5)*.04,burn:0,electric:0,hp:100, fuse:0};objs.push(o);if(objs.length>250)objs.shift();count();return o}
function nearest(x,y,r=45){let best=null,bd=r*r;for(let o of objs){let d=(o.x-x)**2+(o.y-y)**2;if(d<bd){bd=d;best=o}}return best}
function burst(x,y,color,n=22,power=5){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=Math.random()*power;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6+Math.random()*.7,color,size:2+Math.random()*3})}}
function explode(x,y,r=190,power=12){burst(x,y,'#ff9a56',36,8);particles.push({x,y,r:2,max:r,life:1,ring:true});for(let o of objs){let dx=o.x-x,dy=o.y-y,d=Math.hypot(dx,dy)||1;if(d<r){let f=(1-d/r)*power;o.vx+=dx/d*f;o.vy+=dy/d*f-2;o.av+=(Math.random()-.5)*.22;if(o.type==='bomb'||o.type==='rocket')o.fuse=0}}toast('blast force applied')}
function action(tool,x,y){let o=nearest(x,y,55);if(tool==='delete'){if(o){objs=objs.filter(a=>a.id!==o.id);wires=wires.filter(w=>w.a!==o.id&&w.b!==o.id);count()}return}if(tool==='grab'){if(o){drag={id:o.id,dx:x-o.x,dy:y-o.y,px:x,py:y};}return}if(tool==='wire'){if(!o){toast('tap an object to connect');return}if(!wireStart){wireStart=o.id;toast('now tap a second object');}else if(wireStart!==o.id){wires.push({a:wireStart,b:o.id});wireStart=null;toast('wire connected')}return}if(tool==='fire'){if(o){o.burn=1;burst(o.x,o.y,'#ff754e',12,3);toast('object ignited')}return}if(tool==='electric'){if(o){o.electric=2.5;burst(o.x,o.y,'#71e7ff',18,5);for(let other of objs){let d=Math.hypot(other.x-o.x,other.y-o.y);if(d<100)other.electric=1.5}toast('electric charge applied')}return}if(tool==='heal'){if(o){o.burn=0;o.electric=0;o.hp=100;toast('object repaired')}return}}
function build(){let el=document.getElementById('items');el.innerHTML='';document.getElementById('heading').textContent={people:'SPAWN CHARACTERS',props:'SPAWN OBJECTS',weapons:'WEAPONS & DEVICES',tools:'TOOLS & ACTIONS'}[cat];for(let [id,emoji,name] of catalog[cat]){let b=document.createElement('button');b.className='item'+(id===selected?' on':'');b.innerHTML=`<span class="emoji">${emoji}</span><span>${name}</span>`;b.onclick=()=>{selected=id;build();toast(name+' selected')};el.appendChild(b)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;selected=catalog[cat][0][0];build()});build();
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{selected=b.dataset.tool;cat='tools';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.cat==='tools'));build();toast(b.title+' tool selected')});
document.getElementById('gravity').onchange=e=>gravity=e.target.checked;document.getElementById('collisions').onchange=e=>collisions=e.target.checked;document.getElementById('spread').onchange=e=>spread=e.target.checked;document.getElementById('grid').onchange=e=>showGrid=e.target.checked;
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶ Resume':'Ⅱ Pause';document.getElementById('state').textContent=paused?'PAUSED':'LIVE';toast(paused?'simulation paused':'simulation running')};
document.getElementById('step').onclick=()=>{if(!paused){toast('pause first, then step');return}for(let i=0;i<4;i++)tick(.016);draw()};
document.getElementById('clear').onclick=()=>{objs=[];particles=[];wires=[];count();toast('arena cleared')};
function save(){try{localStorage.setItem('chaosLabSave',JSON.stringify({objs,wires,idseq,gravity,collisions,spread,showGrid}));toast('scene saved on this device')}catch(e){toast('save unavailable in this browser mode')}}
function load(){try{let d=JSON.parse(localStorage.getItem('chaosLabSave'));if(!d){toast('no saved scene yet');return}objs=d.objs||[];wires=d.wires||[];idseq=d.idseq||1;gravity=d.gravity!==false;collisions=d.collisions!==false;spread=d.spread!==false;showGrid=d.showGrid!==false;document.getElementById('gravity').checked=gravity;document.getElementById('collisions').checked=collisions;document.getElementById('spread').checked=spread;document.getElementById('grid').checked=showGrid;count();toast('scene loaded')}catch(e){toast('could not load saved scene')}}
document.getElementById('save').onclick=save;document.getElementById('load').onclick=load;
function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{let p=point(e);mouse=p;canvas.setPointerCapture(e.pointerId);if(p.x<side())return;
if(['grab','wire','fire','electric','delete','heal'].includes(selected)){action(selected,p.x,p.y);return}
let o=nearest(p.x,p.y,22);if(o&&e.button===2){drag={id:o.id,dx:p.x-o.x,dy:p.y-o.y,px:p.x,py:p.y};return}
if(['bomb','rocket'].includes(selected)){let z=add(selected,p.x,p.y);z.fuse=selected==='bomb'?1.7:.8;z.vx=selected==='rocket'?4:0;z.vy=selected==='rocket'?-3:0;return}
if(['pistol','laser'].includes(selected)){let dx=objs.length?1:1;burst(p.x,p.y,selected==='laser'?'#ff343f':'#ffd36c',8,3);for(let target of objs){let d=Math.hypot(target.x-p.x,target.y-p.y);if(d<200&&Math.abs(target.y-p.y)<55&&target.x>p.x){target.vx+=selected==='laser'?7:4;target.hp-=selected==='laser'?55:25;if(target.hp<=0)burst(target.x,target.y,'#d74e61',14,4)}}toast(selected==='laser'?'laser fired':'blaster fired');return}
add(selected,p.x,p.y)});
canvas.addEventListener('pointermove',e=>{let p=point(e);if(drag){let o=objs.find(a=>a.id===drag.id);if(o){o.x=p.x-drag.dx;o.y=p.y-drag.dy;o.vx=(p.x-drag.px)*.7;o.vy=(p.y-drag.py)*.7;drag.px=p.x;drag.py=p.y}}mouse=p});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('contextmenu',e=>e.preventDefault());
function drawGrid(){c.fillStyle='#111823';c.fillRect(0,0,W,H);if(showGrid){c.strokeStyle='#1d2938';c.lineWidth=1;for(let x=0;x<W;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<H;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}}c.fillStyle='#0a0e14';c.fillRect(0,floor(),W,H-floor());c.fillStyle='#334256';c.fillRect(0,floor(),W,2)}
function drawObj(o){c.save();c.translate(o.x,o.y);c.rotate(o.a);let {w,h,type}=o;c.lineCap='round';
if(['ragdoll','heavy','robot','skeleton','dummy'].includes(type)){let col=o.burn?'#ff8a50':type==='heavy'?'#9fbfff':type==='robot'?'#64ddcc':type==='skeleton'?'#c9d1db':'#e8eef7';c.strokeStyle=col;c.lineWidth=type==='heavy'?7:4.5;c.fillStyle=col;c.beginPath();c.arc(0,-h*.37,5.5,0,7);c.fill();c.beginPath();c.moveTo(0,-h*.23);c.lineTo(0,h*.13);c.moveTo(0,-h*.13);c.lineTo(-w*.58,0);c.moveTo(0,-h*.13);c.lineTo(w*.58,0);c.moveTo(0,h*.13);c.lineTo(-w*.36,h*.48);c.moveTo(0,h*.13);c.lineTo(w*.36,h*.48);c.stroke();if(type==='robot'){c.fillStyle='#101a25';c.fillRect(-3,-h*.4,2,2);c.fillRect(2,-h*.4,2,2)}if(type==='skeleton'){c.strokeStyle='#fff';c.lineWidth=1.5;for(let i=0;i<4;i++){c.beginPath();c.moveTo(-4+i*2,h*.0);c.lineTo(4-i*2,h*.05+i*2);c.stroke()}}}
else if(type==='crate'||type==='metal'||type==='plank'){c.fillStyle=type==='crate'?'#9b7048':type==='metal'?'#66778d':'#795b42';c.fillRect(-w/2,-h/2,w,h);c.strokeStyle=type==='metal'?'#bdcce0':'#d3b18b';c.lineWidth=2;c.strokeRect(-w/2,-h/2,w,h);if(type==='crate'){c.beginPath();c.moveTo(-w/2,-h/2);c.lineTo(w/2,h/2);c.moveTo(w/2,-h/2);c.lineTo(-w/2,h/2);c.stroke()}}
else if(type==='barrel'||type==='bomb'){c.fillStyle=type==='bomb'?'#293544':'#b83f4b';c.beginPath();c.roundRect(-w/2,-h/2,w,h,5);c.fill();c.strokeStyle='#f6b2a6';c.strokeRect(-w/2,-h/2,w,h);c.fillStyle='#111';c.fillRect(-w/2,-2,w,4)}
else if(type==='ball'){c.fillStyle='#61cfff';c.beginPath();c.arc(0,0,w,0,7);c.fill();c.strokeStyle='#c9f4ff';c.stroke()}
else if(type==='car'){c.fillStyle='#526f9d';c.fillRect(-w/2,-h/2,w,h*.68);c.fillStyle='#9cc8ed';c.fillRect(-w*.2,-h*.48,w*.4,h*.3);c.fillStyle='#070a0f';for(let x of [-w*.3,w*.3]){c.beginPath();c.arc(x,h*.3,6,0,7);c.fill()}}
else if(type==='spring'){c.strokeStyle='#8be6a1';c.lineWidth=4;c.beginPath();c.moveTo(-w/2,h/2);for(let i=0;i<6;i++)c.lineTo(-w/2+i*w/5,(i%2?-1:1)*h/2);c.stroke()}
else if(type==='lamp'){c.fillStyle='#e5d89a';c.fillRect(-4,-h/2,8,h);c.beginPath();c.arc(0,-h/2,8,0,7);c.fill()}
else if(['pistol','laser','rocket'].includes(type)){c.fillStyle=type==='laser'?'#e34b5e':type==='rocket'?'#e9edf4':'#8d9db1';c.fillRect(-w/2,-h/2,w,h);c.fillStyle='#303a48';c.fillRect(-w*.25,h/2,w*.25,h)}
if(o.electric>0){c.strokeStyle='#7beaff';c.lineWidth=2;c.beginPath();c.arc(0,0,Math.max(w,h)*.8+Math.random()*3,0,7);c.stroke()}if(drag&&drag.id===o.id){c.strokeStyle='#6ce3ff';c.setLineDash([4,4]);c.strokeRect(-w/2-7,-h/2-7,w+14,h+14)}c.restore()}
function tick(dt){if(!paused){for(let o of objs){if(drag&&drag.id===o.id)continue;if(gravity)o.vy+=.34*dt*60;if(o.type==='spring'&&o.y+o.h/2>=floor()-2)o.vy=-10;if(o.fuse>0){o.fuse-=dt;if(o.type==='rocket'){o.vy-=.18;o.vx+=.06;burst(o.x-o.w/2,o.y,'#ff985b',2,1)}if(o.fuse<=0){if(o.type==='bomb')explode(o.x,o.y,200,14);else explode(o.x,o.y,145,10);o.remove=true}}o.x+=o.vx*dt*60;o.y+=o.vy*dt*60;o.a+=o.av*dt*60;o.vx*=.997;o.av*=.995;
if(o.y+o.h/2>floor()){o.y=floor()-o.h/2;if(o.vy>1)o.vy=-o.vy*(o.type==='ball'?.78:.24);else o.vy=0;o.vx*=.985;o.av*=.92}if(o.x<side()+o.w/2)o.x=side()+o.w/2;if(o.x>W-o.w/2)o.x=W-o.w/2;
if(o.burn>0){o.burn-=dt*.12;burst(o.x+(Math.random()-.5)*o.w,o.y-o.h/2,'#ff8449',1,1.5);if(spread&&Math.random()<.012){let n=nearest(o.x+(Math.random()-.5)*70,o.y,55);if(n)n.burn=1}if(o.burn<0)o.burn=0}if(o.electric>0){o.electric-=dt; if(Math.random()<.08)burst(o.x,o.y,'#74eaff',3,2)}}
objs=objs.filter(o=>!o.remove);
if(collisions){for(let i=0;i<objs.length;i++)for(let j=i+1;j<objs.length;j++){let a=objs[i],b=objs[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.1,min=(a.w+b.w)*.26;if(dist<min&&Math.abs(dy)<(a.h+b.h)*.5){let nx=dx/dist,ny=dy/dist,p=(min-dist)*.035;a.vx-=nx*p;b.vx+=nx*p;a.vy-=ny*p;b.vy+=ny*p}}}
for(let w of wires){let a=objs.find(o=>o.id===w.a),b=objs.find(o=>o.id===w.b);if(a&&b){let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;if(d>100){a.vx+=dx/d*.025;b.vx-=dx/d*.025;a.vy+=dy/d*.025;b.vy-=dy/d*.025}}}}
particles=particles.filter(p=>p.life>0);for(let p of particles){if(p.ring){p.r+=(p.max-p.r)*.24;p.life-=.07}else{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=.025}}count()}
function draw(){drawGrid();for(let w of wires){let a=objs.find(o=>o.id===w.a),b=objs.find(o=>o.id===w.b);if(a&&b){c.strokeStyle='#65dfff';c.lineWidth=2;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}}for(let o of objs)drawObj(o);for(let p of particles){c.globalAlpha=Math.max(0,p.life);if(p.ring){c.strokeStyle='#ff9a56';c.lineWidth=4;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.stroke()}else{c.fillStyle=p.color;c.fillRect(p.x,p.y,p.size,p.size)}}c.globalAlpha=1}
function loop(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;tick(dt);draw();requestAnimationFrame(loop)}
add('crate',side()+90,floor()-45);add('ragdoll',side()+165,floor()-65);add('ball',side()+240,floor()-90);requestAnimationFrame(loop);
})();
</script></body></html>
